<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calorias</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="topbar">Refeições</div>

<div class="container">
    <form action="/add_calorias" method="POST" class="card form-card">
        <h3>Adicionar Refeição</h3>
        <input type="text" name="nome" placeholder="Alimento" required>
        <input type="number" name="calorias" placeholder="Calorias" required>
        <button class="btn green">Adicionar</button>
    </form>

    <h2>Histórico</h2>

    <table>
        <tr><th>Alimento</th><th>Calorias</th><th>Data</th></tr>

        {% for r in refeicoes %}
        <tr>
            <td>{{ r[0] }}</td>
            <td>{{ r[1] }}</td>
            <td>{{ r[2] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/" class="btn">Voltar</a>
</div>

</body>
</html>
