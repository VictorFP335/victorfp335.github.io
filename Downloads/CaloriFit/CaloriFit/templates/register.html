<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CaloriFit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .auth-container { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 450px; text-align: center; }
        .auth-container h2 { margin-top: 0; color: #38bdf8; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 6px; background: #334155; color: white; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; font-family: 'Inter', sans-serif;}
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        button { width: 100%; padding: 10px; background: #38bdf8; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        .links { margin-top: 15px; font-size: 0.9em; }
        .links a { color: #94a3b8; text-decoration: none; }
        .links a:hover { color: white; }
        .flash { background: #ef4444; color: white; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Criar Conta</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="nome" placeholder="Seu Nome" required>
            <input type="email" name="email" placeholder="Seu E-mail" required>
            <input type="password" name="senha" placeholder="Sua Senha" required>
            
            <div class="row">
                <input type="number" name="idade" placeholder="Idade" required>
                <select name="sexo" required>
                    <option value="" disabled selected>Sexo</option>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                </select>
            </div>
            <div class="row">
                <input type="number" step="0.1" name="peso" placeholder="Peso (kg)" required>
                <input type="number" step="0.1" name="altura" placeholder="Altura (cm)" required>
            </div>
            
            <select name="objetivo" required>
                <option value="" disabled selected>Qual o seu principal objetivo?</option>
                <option value="Emagrecer">Emagrecer / Perder Peso</option>
                <option value="Ganhar Massa Muscular">Ganhar Massa Muscular</option>
                <option value="Manter o Peso">Manter o Peso</option>
                <option value="Forma Física para Evento">Forma Física para Evento (Ex: Casamento)</option>
                <option value="Bem-estar e Saúde">Bem-estar e Saúde</option>
            </select>
            
            <textarea name="anotacoes" placeholder="Conte-nos mais sobre seu propósito... (Ex: Quero melhorar minha saúde para o meu casamento em dezembro)"></textarea>

            <button type="submit">Cadastrar</button>
        </form>
        <div class="links">
            <a href="/login">Já tem conta? Faça login</a>
        </div>
    </div>
</body>
</html>
