<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CaloriFit - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="topbar">CaloriFit</div>

<div class="container">

    <h2>Dashboard Diário</h2>

    <div class="cards">
        <div class="card green">
            <h3>Consumidas</h3>
            <p>{{ ingeridas }} kcal</p>
        </div>

        <div class="card blue">
            <h3>Gastas</h3>
            <p>{{ gastas }} kcal</p>
        </div>

        <div class="card orange">
            <h3>Saldo</h3>
            <p>{{ saldo }} kcal</p>
        </div>
    </div>

    <h2>Gráfico do Dia</h2>
    <canvas id="graficoCalorias"></canvas>

    <br><br>

    <div class="menu">
        <a href="/calorias" class="btn">Registrar Refeições</a>
        <a href="/exercicios" class="btn">Registrar Exercícios</a>
    </div>

</div>

<script>
fetch("/grafico-data")
    .then(r => r.json())
    .then(data => {
        new Chart(document.getElementById("graficoCalorias"), {
            type: 'bar',
            data: {
                labels: ["Consumidas", "Gastas"],
                datasets: [{
                    label: "Calorias",
                    data: [data.ingeridas, data.gastas]
                }]
            }
        });
    });
</script>

</body>
</html>
